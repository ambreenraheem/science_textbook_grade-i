[pytest]
# Grade-1 Science Learning Web Application
# Pytest Configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    # Performance: run tests in parallel (install pytest-xdist)
    # -n auto

# Custom markers for test categorization
markers =
    contract: Database contract tests (TDD for queries)
    integration: End-to-end user journey tests
    unit: Library unit tests
    slow: Tests that take >1 second to run
    db: Tests that require database connection
    ui: Tests that interact with Streamlit UI

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Asyncio configuration
asyncio_mode = auto

# Minimum Python version
minversion = 3.11
